<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Club Ratings"><link rel="manifest" href="manifest.webmanifest"><title>Club Rating Keeper</title><style>
:root{font-family:system-ui;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#172554;color:white;padding:20px}main{max-width:850px;margin:auto;padding:14px}h1{font-size:1.3rem;margin:0}h2{font-size:1rem}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:9px;padding:10px 13px;background:#1d4ed8;color:white;font:inherit;font-weight:650}.secondary{background:#e2e8f0;color:#172033}.danger{background:#fee2e2;color:#991b1b}.active{background:#172554}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:12px 0}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:block;font-size:.8rem;font-weight:650;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid #e8edf3}td:last-child,th:last-child{text-align:right}.muted{color:#64748b;font-size:.82rem}.game{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}.game small{display:block;color:#64748b}.pill{background:#dbeafe;padding:2px 7px;border-radius:20px}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:9px}}@media print{header,.tabs,.no-print{display:none!important}.panel{border:0}}
</style></head><body><header><h1>♟ Club Rating Keeper</h1><div>North Dallas Chess Club · Blitz</div></header><main>
<nav class="tabs no-print"><button data-tab="board" class="active">Leaderboard</button><button data-tab="record">Record game</button><button data-tab="history">History</button><button data-tab="players">Players</button><button data-tab="backup">Backup</button></nav>
<section id="board"><div class="panel"><div style="display:flex;justify-content:space-between"><h2>Club standings</h2><button class="secondary no-print" onclick="print()">Print</button></div><div id="leader"></div><p class="muted">New players start at 1400. K-factor: <span id="kshow">20</span>.</p></div></section>
<section id="record" class="hidden"><div class="panel"><h2 id="formtitle">Record a blitz game</h2><form id="gameform"><input id="gid" type="hidden"><div class="grid"><div><label>White</label><select id="white" required></select></div><div><label>Black</label><select id="black" required></select></div><div><label>Result</label><select id="result"><option value="1">White wins</option><option value=".5">Draw</option><option value="0">Black wins</option></select></div><div><label>Date/time</label><input id="when" type="datetime-local" required></div></div><div class="actions"><button id="savegame">Save game</button><button type="button" id="cancel" class="secondary hidden">Cancel</button></div><div id="msg" class="muted"></div></form></div></section>
<section id="history" class="hidden"><div class="panel"><h2>Game history</h2><div id="games"></div></div></section>
<section id="players" class="hidden"><div class="panel"><h2>Add a player</h2><form id="playerform"><label>Name</label><input id="pname" maxlength="50" required placeholder="Player name"><label>Starting rating</label><input id="prating" type="number" min="100" max="4000" value="1400" required><div class="actions"><button>Add player</button></div></form></div><div class="panel"><h2>Roster</h2><div id="roster"></div></div></section>
<section id="backup" class="hidden"><div class="panel"><h2>Backup & settings</h2><p class="muted">Data is saved in this browser on this device. Export backups regularly.</p><div class="actions"><button id="backupbtn">Download JSON backup</button><button class="secondary" id="csvbtn">Export CSV</button></div><label>Restore backup</label><input id="file" type="file" accept=".json,application/json"><button class="secondary" id="restore">Restore</button><label>K-factor</label><input id="kfactor" type="number" min="1" max="100" value="20"><button id="savek">Save K-factor</button></div></section>
</main><script>
const KEY='ndcc-rating-v1',el=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.players)||!Array.isArray(db.games))db={players:[],games:[],k:20};db.k=db.k||20;let rates={};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function calc(){rates={};db.players.forEach(p=>rates[p.id]={v:+p.start||1400,w:0,d:0,l:0,n:0});[...db.games].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created).forEach(g=>{let a=rates[g.w],b=rates[g.b];if(!a||!b)return;let e=1/(1+10**((b.v-a.v)/400)),change=Math.round(db.k*(+g.result-e));a.v+=change;b.v-=change;a.n++;b.n++;if(+g.result===1){a.w++;b.l++}else if(+g.result===0){b.w++;a.l++}else{a.d++;b.d++}})}
function sorted(){calc();return [...db.players].sort((a,b)=>rates[b.id].v-rates[a.id].v||a.name.localeCompare(b.name))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let ps=sorted();el('kshow').textContent=db.k;el('leader').innerHTML=ps.length?'<table><tr><th>#</th><th>Player</th><th>Rating</th><th>W-D-L</th><th>Games</th></tr>'+ps.map((p,i)=>{let r=rates[p.id];return '<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+r.v+'</td><td>'+r.w+'-'+r.d+'-'+r.l+'</td><td>'+r.n+'</td></tr>'}).join('')+'</table>':'<p class="muted">Add your first player in Players.</p>';let opts=ps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' ('+rates[p.id].v+')</option>').join('');let w=el('white').value,b=el('black').value;el('white').innerHTML=opts;el('black').innerHTML=opts;if(ps.some(p=>p.id===w))el('white').value=w;if(ps.some(p=>p.id===b))el('black').value=b;el('savegame').disabled=ps.length<2;el('roster').innerHTML=ps.map(p=>'<div class="game"><span>'+esc(p.name)+' · '+rates[p.id].v+'</span><button class="danger" onclick="removePlayer(\''+p.id+'\')">Remove</button></div>').join('')||'<p class="muted">No players yet.</p>';let gs=[...db.games].sort((a,b)=>b.date.localeCompare(a.date));el('games').innerHTML=gs.map(g=>'<div class="game"><div>'+esc(g.wn)+' <span class="pill">'+(+g.result===1?'1-0':+g.result===0?'0-1':'½-½')+'</span> '+esc(g.bn)+'<small>'+new Date(g.date).toLocaleString()+'</small></div><div><button class="secondary" onclick="editGame(\''+g.id+'\')">Edit</button> <button class="danger" onclick="delGame(\''+g.id+'\')">×</button></div></div>').join('')||'<p class="muted">No games recorded.</p>';el('kfactor').value=db.k}
function tab(id){['board','record','history','players','backup'].forEach(x=>el(x).classList.toggle('hidden',x!==id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
el('playerform').onsubmit=e=>{e.preventDefault();let name=el('pname').value.trim(),start=+el('prating').value;if(db.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('That player is already listed.');if(!name||!Number.isInteger(start)||start<100||start>4000)return;db.players.push({id:uid(),name,start});save();el('pname').value='';el('prating').value=1400;render()};
function reset(){el('gid').value='';el('formtitle').textContent='Record a blitz game';el('savegame').textContent='Save game';el('cancel').classList.add('hidden');let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());el('when').value=d.toISOString().slice(0,16);el('result').value='1'}
el('gameform').onsubmit=e=>{e.preventDefault();let w=el('white').value,b=el('black').value;if(!w||!b||w===b)return el('msg').textContent='Choose two different players.';let wp=db.players.find(p=>p.id===w),bp=db.players.find(p=>p.id===b),id=el('gid').value,old=db.games.find(g=>g.id===id);let g={id:id||uid(),w,b,wn:wp.name,bn:bp.name,result:+el('result').value,date:new Date(el('when').value).toISOString(),created:old?.created||Date.now()};if(id)db.games[db.games.findIndex(x=>x.id===id)]=g;else db.games.push(g);save();reset();render();tab('board')};
el('cancel').onclick=()=>{reset();tab('history')};
window.editGame=id=>{let g=db.games.find(x=>x.id===id);if(!g)return;el('gid').value=id;el('white').value=g.w;el('black').value=g.b;el('result').value=g.result;let d=new Date(g.date);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());el('when').value=d.toISOString().slice(0,16);el('formtitle').textContent='Edit game';el('savegame').textContent='Save changes';el('cancel').classList.remove('hidden');tab('record')};
window.delGame=id=>{if(confirm('Delete this game and recalculate ratings?')){db.games=db.games.filter(g=>g.id!==id);save();render()}};
window.removePlayer=id=>{let p=db.players.find(x=>x.id===id);if(confirm('Remove '+p.name+' and all their recorded games?')){db.players=db.players.filter(x=>x.id!==id);db.games=db.games.filter(g=>g.w!==id&&g.b!==id);save();render()}};
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
el('backupbtn').onclick=()=>download('chess-club-backup.json',JSON.stringify(db,null,2),'application/json');
el('csvbtn').onclick=()=>{let rows=[['Rank','Player','Rating','Wins','Draws','Losses','Games'],...sorted().map((p,i)=>{let r=rates[p.id];return [i+1,p.name,r.v,r.w,r.d,r.l,r.n]})];download('club-ratings.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};
el('restore').onclick=async()=>{let f=el('file').files[0];if(!f)return alert('Choose a backup file.');try{let x=JSON.parse(await f.text());if(!Array.isArray(x.players)||!Array.isArray(x.games))throw 0;if(confirm('Replace current data with this backup?')){db={players:x.players,games:x.games,k:+x.k||20};save();render()}}catch{alert('Invalid backup file.')}};
el('savek').onclick=()=>{let k=+el('kfactor').value;if(!Number.isInteger(k)||k<1||k>100)return alert('K-factor must be 1–100.');db.k=k;save();render()};
reset();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
